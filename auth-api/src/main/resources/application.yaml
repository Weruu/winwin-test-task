server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  internal-token: ${INTERNAL_TOKEN}
  data-api:
    url: ${DATA_API_URL:http://data-api:8081}