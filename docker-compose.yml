services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  data-api:
    build: ./data-api
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
    ports:
      - "8081:8081"
    networks:
      - backend

  auth-api:
    build: ./auth-api
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-minimum-32-chars}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      DATA_API_URL: http://data-api:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      data-api:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
